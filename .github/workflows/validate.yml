name: Validate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Test public contract validation
        run: node --test scripts/*.test.mjs

      - name: Validate public OpenAPI contract
        run: node scripts/validate.mjs
