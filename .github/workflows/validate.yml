name: Validate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Test public contract validation
        run: node --test scripts/*.test.mjs

      - name: Validate public OpenAPI contract
        run: node scripts/validate.mjs
